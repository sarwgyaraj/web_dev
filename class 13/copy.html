<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        body{
            perspective: 900px;
        }
        #main{
            height: 600px;
            width: 400px;
            position: relative;
            margin: 50px auto;
            transition: 3s;
            transform-style: preserve-3d;
        }
        #one{
            height: 50%;
            width: 100%;
            position: absolute;
            background-color: rgb(169, 106, 227);
            z-index: 1;
            backface-visibility: hidden;
        
        }
        #two{
            height: 50%;
            width: 100%;
            position: absolute;
            background-color: rgb(141, 223, 18);
            transform: rotateY(180deg);
    
        }
        #main:hover{
            transform: rotateY(180deg);
        }
        img{
            width: 400px;
            height: 300px;
        }
    </style>
</head>

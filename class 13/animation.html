<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 100px;
            width: 100px;
            background: #77eccb;
        }
        div:hover{
            animation-name: anime;
            animation-duration: 3s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
        }
        @keyframes anime {
            0%{
                background: #f29f9f;
                border-radius: 50%;
            }
            50%{
                background: #000;
                height: 100vh;
            }
            75%{
                background: #93e26b;
                width: 100vw;
            }
            100%{
                background-color: gold;
                border-radius: 50%;
            }
        }
    </style>
</head>
<body>
    <div></div>
</body>
</html>

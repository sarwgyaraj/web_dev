<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #box {
        width: 100px;
        height: 100px;
        border: 2px solid black;
        padding: 10px;
        margin: 10px;
        background-color: lightblue;
      }
      #line1 {
        width: 100px;
        height: 100px;
        border: 2px solid black;
        padding: 10px;
        margin: 10px;
        background-color: lightgreen;
        display: block;
      }
      #line2 {
        width: 100px;
        height: 100px;
        border: 2px solid black;
        padding: 10px;
        margin: 10px;
        background-color: lightcoral;
        display: inline;
      }
      #line3 {
        width: 100px;
        height: 100px;
        border: 2px solid black;
        padding: 10px;
        margin: 10px;
        background-color: lightyellow;
        display: inline-block;
      }
      #line4 {
        width: 100px;
        height: 100px;
        border: 2px solid black;
        padding: 10px;
        margin: 10px;
        background-color: lightpink;
        display: none;
        visibility: hidden;
      }
        #line5 {
            height: 100px;
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
            background-color: lightgray;
            display: block;
            visibility: visible;
        }
        #one {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
            background-color: lightblue;
            display: inline-block;
        }
        #two {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
            background-color: lightgreen;
            display: inline-block;
            position: relative;
            top: 120px;
            right: 1px;
        }
        #three {
            width: 100px;
            height: 100px;
            border: 2px solid black;
            padding: 10px;
            margin: 10px;
            background-color: lightcoral;
            display: inline-block;
            position: absolute;
        }
    </style>
  </head>
  <body>
    <div id="box">Hello, World!</div>
    <div id="line1">Hello, World!</div>
    <span id="line2">Hello, World!</span>
    <span id="line3">Hello, World!</span>
    <div id="line4">Hello, World!</div>
    <div id="line5">Hello, World!</div>
    <div id="one"></div>
    <div id="two"></div>
    <data id="three"></data>
  </body>
</html>

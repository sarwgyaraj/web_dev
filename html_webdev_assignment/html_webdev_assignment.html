<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .links{
            background-color: black;
         
        }
    </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">🏠 Dream Home</div>
    <ul class="links">
      <li>Home</li>
      <li>Properties</li>
      <li>About</li>
    </ul>
  </nav>
  <div class="content">
    <div class="card">
      <div class="image">
        <img src="" alt="House">
        <div class="for-sale">FOR SALE</div>
        <div class="heart-btn">❤️</div>
        <div class="price-tag">₹50 Lakhs</div>
      </div>

      <div class="card">
        <h2>Beautiful 2BHK House</h2>
        <div class="detail">📍 Pune, Maharashtra</div>
        <div class="detail">🛏️ 2 Bedrooms</div>
        <div class="detail">🚿 2 Bathrooms</div>
        <div class="detail">📏 1200 sq ft</div>
        <button class="details-btn">View Details</button>
      </div>
    </div>
  </div>
  <button class="contact-us-btn">Contact Us</button>
</body>
</html>

<!DOCTYPE html>

    <style>
        nav{
            height: 15vh;
            color: white;
        }
        #main{
            height: 90vh;
            display: grid;
            grid-template-columns: 340px 350px 360px 380px;
            grid-template-rows: 150px 200px 250px 100px;
            gap: 20px;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        .one{
            border: 1px solid rgb(237, 227, 227);
            border-radius: 20px;
            opacity: 0.7;
        }
        img{
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
        }
        .one:hover{
            transform: scale(1.1);
            transition: 0.5s;
            opacity: 1;
        }
        #big{
            height: 40vh;
            width: 100%;
            border: 1px solid rgb(237, 227, 227);
            border-radius: 20px;
            opacity: 0.7;
            overflow: hidden;
            object-fit: cover;
            position: relative;
        }
        #big:hover{
            transform: scale(1.1);
            transition: 0.5s;
            opacity: 1;
        }
        #h33{
            color: white;
            position: absolute;
            opacity: 0;
            top: 235px;
            left: 10px;
            font-size: 30px;
            margin-top: 10px;
            margin-left: 10px;
        }
        #h33:hover{
            opacity: 1;
            transition: 0.5s;
        }
    </style>
</head>

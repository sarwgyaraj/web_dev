<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      #one {
        width: 100px;
        height: 100px;
        display: inline-block;
        background-color: rgb(123, 219, 236);
      }
      #two {
        width: 100px;
        height: 100px;
        display: inline-block;
        background-color: rgb(89, 89, 223);
        position: absolute;
        top: 0px;
        /* position: relative;
        top: 50px; */
        /* position: static;
        top: 60px */
      }
      #three {
        width: 100px;
        height: 100px;
        display: inline-block;
        background-color: rgb(135, 231, 114);
      }
      #parent {
        height: 500px;
        width: 300px;
        border: 2px solid rgb(215, 106, 106);
        margin: 20px auto;
        position: relative;
      }
      #child {
        height: 50px;
        width: 50px;
        background-color: aqua;
        position: absolute;
        top: 20px;
      }
    </style>
  </head>
  <body>
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    <div id="parent">
      <div id="child"></div>
    </div>
  </body>
</html>

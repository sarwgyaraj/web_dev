<!DOCTYPE html>
<html>
<head>
  <title>Simple Navbar</title>
  <style>
    body {
      margin: 0;
    }
    .navbar {
      background: rgb(28, 28, 29);
      padding: 10px;
    }
    .navbar a {
      color: white;
      padding: 10px;
    }
    @media (max-width: 480px) {
        .navbar a {
            display: flex;
            text-align: center;
        }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="#">Home</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </nav>

</body>
</html>

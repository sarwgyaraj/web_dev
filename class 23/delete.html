<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <script>
        let a=[1,2,3,4,5,"hello"]
        console.log(a[1]);

        let student={
            name:"om",
            lastName:"jain",
            age:16
        }
        console.log(student.age);

        let arr=[1,2,3,4,5,6]
        for(let i=0;i<arr.length;i++)
        {
            console.log(arr[i]);
        }
        
        for(let i in arr)                //in prints index numbers
        {
            console.log(i);
        }


        for(let i of arr)                   //of prints value of array in its indexes
        {
            console.log(i);
        }


        for(let i of arr)                   
        {
             if(i%2==0)
                console.log(i);
        }
        for(let i of arr)                   
        {
             if(i%2==1)
                console.log(i);
        }

        for(let i=0;i<arr.length;i++)
        {
            let c=0
             for(let j=2;j<=arr[i];j++)
             {
                if(arr[i]%j==0)
                    c++;
             }
             if(c==1)
             console.log(arr[i]);
        }

        let arr1=[1,2,3,[5,6]]
        console.log(arr1[3][0]);

        let obj={
            name:"om",
            details:{
                age:1
            }
        }
        console.log(obj.details.age);

        for(let i=1;i<=4;i++)
        {
            let str=" ";
            for(let j=4;j>=1;j--)
            {
                if(j>i)
                str+=" ";
                else
                str+="*";
            }
            console.log(str);
        }

    </script>

<!DOCTYPE html>
<html>
<head>
<title>Layout 2</title>

<style>
body {
    background: #f0efe9;
}

.container {
    width: 600px;
    margin: 100px auto;
}

.box {
    width: 294px;
    height: 55px;
    display: inline-block;
    margin-bottom: 12px;
}

.tan {
    background: #d9b26a;
}

.teal {
    background: #4fc3bd;
}

.orange {
    background: #f0a500;
}

.cream {
    background: #e8cf9c;
}

.red {
    width: 600px;
    height: 90px;
    background: #a02c2c;
}
</style>

</head>

<body>

<div class="container">

    <div class="box tan"></div>
    <div class="box teal"></div>

    <div class="box teal"></div>
    <div class="box orange"></div>

    <div class="box orange"></div>
    <div class="box cream"></div>

    <div class="red"></div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main{
            height: 90vh;
            display: grid;
            border: 1px solid black;
            grid-template-columns: 300px 320px 330px 340px;
            grid-template-rows: 150px 200px 250px 100px;
        }
        .one{
            border: 1px solid black;
            background-color: lightblue;
        }
    </style>
</head>
<body>
    <div id="main">
    <div class="one">1</div>
    <div class="one">2</div>
    <div class="one">3</div>
    <div class="one">4</div>
    <div class="one">5</div>
    <div class="one">6</div>
    <div class="one">7</div>
    <div class="one">8</div>
    </div>
</body>
</html>

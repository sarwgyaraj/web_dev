<!DOCTYPE html>
<html>
<head>
  <title>Range Rover</title>

  <style>
    /* Remove the default white space around the page */
    body {
      margin: 0;
      font-family: Arial;
    }

    /* Dark blue bar at the top */
    .banner {
      background-color: navy;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .banner a {
      color: white;
    }

    /* White menu bar */
    .menu {
      background-color: white;
      text-align: center;
      padding: 20px;
    }

    .menu a {
      color: black;
      text-decoration: none;
      margin: 10px;
    }

    .menu h2 {
      margin: 10px;
    }

    /* Big picture section with the car */
    .hero {
      background-image: url("car.jpg");
      background-size: cover;
      height: 600px;
      color: white;
      padding: 80px;
    }
    .hero h1 {
      font-size: 45px;
      width: 600px;
    }

    /* Buttons */
    .button1 {
      background-color: white;
      color: black;
      padding: 15px;
      text-decoration: none;
    }

    .button2 {
      background-color: gray;
      color: white;
      padding: 15px;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <!-- Top bar -->
  <div class="banner">
    Find your perfect Range Rover. <a href="#">Search in stock vehicles.</a>
  </div>

  <!-- Menu -->
  <div class="menu">
    <h2>RANGE ROVER</h2>
    <a href="#">VEHICLES</a>
    <a href="#">OWNERS</a>
    <a href="#">EXPLORE</a>
    <a href="#">SHOP NOW</a>
    <a href="#">RETAILERS</a>
    <a href="#">BUILDS</a>
    <a href="#">SUPPORT &amp; CHAT</a>
  </div>

  <!-- Car picture with text -->
  <div class="hero">
    <h1>BESPOKE DUO-TONE FADE FINISH</h1>
    <p>FOR THE FIRST TIME ON RANGE ROVER</p>
    <br>
    <a class="button1" href="#">COMMISSION YOURS</a>
    <a class="button2" href="#">FIND OUT MORE</a>
  </div>

</body>
</html>
